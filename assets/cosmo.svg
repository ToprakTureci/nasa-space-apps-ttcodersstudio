<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="Cosmo AI avatar">
  <defs>
    <radialGradient id="bg" cx="50%" cy="35%" r="75%">
      <stop offset="0%" stop-color="#1E3A8A"/>
      <stop offset="55%" stop-color="#0B1324"/>
      <stop offset="100%" stop-color="#050912"/>
    </radialGradient>
    <linearGradient id="visor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7DD3FC"/>
      <stop offset="55%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <circle cx="100" cy="100" r="100" fill="url(#bg)"/>
  <circle cx="100" cy="100" r="86" fill="url(#glow)"/>

  <!-- stars -->
  <g fill="#E0F2FE" opacity="0.9">
    <circle cx="38" cy="46" r="1.8"/>
    <circle cx="160" cy="40" r="1.4"/>
    <circle cx="168" cy="96" r="1.1"/>
    <circle cx="30" cy="112" r="1.2"/>
    <circle cx="146" cy="158" r="1.5"/>
    <circle cx="56" cy="166" r="1.1"/>
  </g>

  <!-- antenna -->
  <path d="M100 44 V30" stroke="#94A3B8" stroke-width="4" stroke-linecap="round"/>
  <circle cx="100" cy="26" r="7" fill="#34D399"/>
  <circle cx="100" cy="26" r="12" fill="#34D399" opacity="0.25"/>

  <!-- helmet -->
  <circle cx="100" cy="102" r="52" fill="url(#body)"/>
  <circle cx="100" cy="102" r="52" fill="none" stroke="#E2E8F0" stroke-width="3"/>

  <!-- visor -->
  <rect x="60" y="76" width="80" height="56" rx="28" fill="url(#visor)" stroke="#0F172A" stroke-width="4"/>

  <!-- eyes -->
  <g fill="#0B1324">
    <ellipse cx="83" cy="100" rx="6.5" ry="8"/>
    <ellipse cx="117" cy="100" rx="6.5" ry="8"/>
  </g>
  <g fill="#E0F2FE" opacity="0.95">
    <circle cx="85.5" cy="96.5" r="2.2"/>
    <circle cx="119.5" cy="96.5" r="2.2"/>
  </g>

  <!-- smile -->
  <path d="M88 118 Q100 128 112 118" fill="none" stroke="#0B1324" stroke-width="3.4" stroke-linecap="round"/>

  <!-- visor shine -->
  <path d="M70 84 Q82 74 100 74" fill="none" stroke="#FFFFFF" stroke-opacity="0.55" stroke-width="3" stroke-linecap="round"/>

  <!-- shoulders -->
  <path d="M52 158 Q100 132 148 158" fill="none" stroke="#94A3B8" stroke-width="9" stroke-linecap="round" opacity="0.85"/>
</svg>
